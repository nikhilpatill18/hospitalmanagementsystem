name: java-spring-boot-cicd

on:
  push:

  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services: 
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hospital_management
        ports:
          - 5432:5432

    steps:
      - name: checkout-code
        uses: actions/checkout@v4

      - name: stepup-jdk
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build and build-test
        run: mvn -B clean verify
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hospital_management
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres

      - name: Upload test report
        uses: actions/upload-artifact@v7
        with: 
          name: test-report
          path: target/surefire-reports/

  
  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - name: checkout-code
        uses: actions/checkout@v2

      - name: stepup-jdk
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build Jar for docker
        run: mvn -B clean package -DskipTests

      - name: login to docker
        uses: docker/login-action@v4
        with: 
          username: nikhill18
          password: SUNIL%0571
      
      - name: Build and push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            nikhill18/hms:latest
            nikhill18/hms:${{ github.sha }} 

  deploy-aws-eks:
    runs-on: ubuntu-latest
    needs: docker-build-push

    steps:
      - name: checkout-code
        uses: actions/checkout@v2

      - name: configure aws
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: setup kubetl
        uses: azure/setup-kubectl@v4
      
      - name: update kubeconfig for eks
        run: aws eks update-kubeconfig --name ${{ secrets.CLUSTER_NAME}} --region ap-south-1

      - name: verify connection
        run: kubectl get node

      - name: deploy to aws
        run: kubectl apply -f kubectl.yml