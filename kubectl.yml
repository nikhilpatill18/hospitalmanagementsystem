apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: spring-boot-app
  name: spring-boot-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-boot-app
  template:
    metadata:
      labels:
        app: spring-boot-app
    spec:
      containers:
      - image: nikhill18/hms:latest
        imagePullPolicy: IfNotPresent
        name: spring-boot-app
        env:
        - name: APP_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: APP_MESSAGE
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30

---

apiVersion: v1
kind: Service
metadata:
  labels:
    app: spring-boot-app
  name: spring-boot-app
spec:
  ports:
  - nodePort: 32001
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: spring-boot-app
  sessionAffinity: None
  type: NodePort